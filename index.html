<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Штурманский помощник</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d3b4b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: рабочий инструмент вахтенного — коротко, крупно, без лишнего
   IDEA: карманная штурманская книжка: одна строка «Судно», дальше вкладки по делу
   PICTURE: в каждой вкладке крупный результат; карта неба и схема линий положения
   COLOUR and TYPE: глубокая морская шапка, белое поле, картографический пурпур; Barlow
   LAYOUT: шапка + строка судна + вкладки; на телефоне всё в одну колонку */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f7,#0a1013);--paper:light-dark(#fff,#111a1e);--sea:light-dark(#e3eff3,#0e1f26);
--ink:light-dark(#0f1d24,#dfe8eb);--mute:light-dark(#53646b,#93a5ac);--line:light-dark(#c8d6db,#25373e);
--acc:light-dark(#b0136b,#ff6ab8);--bad:light-dark(#b42318,#ff8a7a);--ok:light-dark(#1765a8,#6cb8ff);--head:#0d3b4b;--headInk:#eaf6f8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
header{background:var(--head);color:var(--headInk);padding:12px max(4vw,14px) 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:600 24px/1.1 "Barlow Semi Condensed",Barlow,sans-serif;margin:0}
.lang{display:flex;border:1px solid rgba(234,246,248,.45);border-radius:9px;overflow:hidden;flex:none}
.lang button{font:600 14px Barlow,sans-serif;min-height:40px;min-width:46px;border:0;background:transparent;color:var(--headInk);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--headInk);color:var(--head)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav button{flex:1 0 auto;font:600 16px Barlow,sans-serif;color:var(--headInk);background:transparent;border:0;padding:11px 14px;min-height:46px;border-radius:10px 10px 0 0;cursor:pointer;opacity:.75}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:12px max(4vw,14px) 48px}
.ship{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px}
.ship .sum{flex:1 1 220px;font-size:15px}.ship .sum b{font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font:600 20px/1.2 "Barlow Semi Condensed",Barlow,sans-serif;margin:0 0 10px}
h3{font:600 15px/1.2 Barlow,sans-serif;margin:14px 0 6px;color:var(--mute)}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mute)}
input,select{font:17px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:46px;width:100%}
input.key{border:2px solid var(--acc);background:var(--paper)}
.tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.b{font:600 15px Barlow,sans-serif;min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.b.p{background:var(--acc);border-color:var(--acc);color:#fff}.b.s{min-height:38px;padding:4px 10px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.big{font:600 clamp(30px,7vw,42px)/1.05 "Barlow Semi Condensed",Barlow,sans-serif;color:var(--acc);white-space:nowrap}
.mid{font:600 26px/1.1 "Barlow Semi Condensed",Barlow,sans-serif;white-space:nowrap}
.k{color:var(--mute);font-size:14px}
.kv{display:flex;flex-wrap:wrap;gap:8px 26px;margin:8px 0}
.note{color:var(--mute);font-size:14px;margin:8px 0 0}.warn{color:var(--bad)}.okc{color:var(--ok)}
details{margin-top:12px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
td:first-child,th:first-child{text-align:left;white-space:normal}
td small{display:block;color:var(--mute);font-size:12px}
.steps td:last-child{font-weight:600}.steps tr.t td{border-bottom:2px solid var(--ink)}
.jt tr.g td{color:var(--mute);font-size:13px;font-weight:600;padding-top:12px;text-align:left}
.jt tr.c td:last-child{color:var(--acc)}.jt td:last-child{font-size:17px;font-weight:600}
.scroll{overflow-x:auto}
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"in res" "pl res";gap:0 14px;align-items:start}
.lg-in{grid-area:in}.lg-res{grid-area:res}.lg-pl{grid-area:pl}
@media(max-width:820px){.lg{grid-template-columns:minmax(0,1fr);grid-template-areas:"in" "res" "pl"}}
@media(max-width:420px){nav button{padding:10px 8px;font-size:15px}.tm{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}.tm input{padding:8px 6px;font-size:16px}}
.fig{position:relative;height:240px;background:var(--sea);border-radius:10px;overflow:hidden;margin-top:10px}
.fig svg,.dome svg{position:absolute;inset:0;width:100%;height:100%}
.dome{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:6px auto 0}
.wl{list-style:none;padding:0;margin:0}.wl li{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.wl b{font-size:17px;white-space:nowrap}.wl span{color:var(--mute);font-size:14px}.wl .b{margin-left:auto}
.wh{font-weight:600;margin:12px 0 2px}
.row3{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 40px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr 40px}.row3 label:first-child{grid-column:1/-1}}
.x{min-height:44px;min-width:40px;border:0;background:transparent;color:var(--mute);font-size:22px;cursor:pointer}
.devg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}.devg input{min-height:40px;padding:6px 8px;font-size:16px}
.logl{list-style:none;padding:0;margin:8px 0 0}.logl li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}.logl li div{flex:1}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;min-height:44px}.chk input{width:22px;height:22px;min-height:0}
#skyTab li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}#skyTab li b{grid-column:1}#skyTab li span:not(.go){grid-column:1}#skyTab .go{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-self:center}#skyTab .go .b{margin:0;font-weight:500}#skyTab li.good b{color:var(--acc)}#skyTab li.low b{color:var(--mute);font-weight:500}
</style>
</head>
<body>
<header>
 <div class="top"><h1 data-t="app"></h1><div class="lang" role="group" aria-label="Язык / Language"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div>
 <nav role="tablist" id="tabs">
  <button role="tab" data-tab="log" data-t="tLog"></button>
  <button role="tab" data-tab="sky" data-t="tSky"></button>
  <button role="tab" data-tab="alt" data-t="tAlt"></button>
  <button role="tab" data-tab="fix" data-t="tFix"></button>
 </nav>
</header>
<div class="wrap">
 <!-- строка «Судно» -->
 <div class="ship"><div class="sum" id="shipSum"></div><button class="b s" id="gpsBtn" data-t="gpsBtn"></button><button class="b s" id="shipEdit" data-t="edit"></button><p class="note" id="gpsMsg" style="flex-basis:100%;margin:0" hidden></p></div>
 <div class="card" id="shipBox" hidden>
  <h2 data-t="shipH"></h2>
  <div class="f">
   <label><span data-t="lat"></span><input id="g.lat" placeholder="38 20.0 N"></label>
   <label><span data-t="lon"></span><input id="g.lon" placeholder="024 17.9 W"></label>
   <label><span data-t="var"></span><input id="g.vr" placeholder="9.0 W"></label>
   <label><span data-t="tz"></span><input id="g.tz" inputmode="decimal" placeholder="-2"></label>
   <label><span data-t="eye"></span><input id="g.e" inputmode="decimal"></label>
   <label><span data-t="ic"></span><input id="g.i" inputmode="decimal" placeholder="-1.2"></label>
   <label><span data-t="temp"></span><input id="g.t" inputmode="decimal"></label>
   <label><span data-t="pres"></span><input id="g.P" inputmode="decimal"></label>
  </div>
  <p class="note" data-t="shipNote"></p>
  <div class="acts"><button class="b p" id="shipDone" data-t="done"></button></div>
 </div>

 <!-- ЖУРНАЛ -->
 <section id="p-log">
  <div class="lg">
   <div class="lg-in">
    <div class="card">
     <h2 data-t="jH"></h2>
     <div class="f">
      <label class="wide"><span data-t="object"></span><select id="j.body"></select></label>
     </div>
     <div class="tm" style="margin-top:10px"><label><span data-t="date"></span><input id="j.date" type="date"></label><label><span data-t="time"></span><input id="j.time" placeholder="08:45:00"></label><button class="b" id="j.now" data-t="now"></button></div>
     <p class="note" id="jClock" style="margin-top:4px"></p>
     <div class="f" style="margin-top:10px">
      <label><span data-t="hg"></span><input id="j.hg" class="key" inputmode="decimal"></label>
      <label id="j.bgBox"><span data-t="bg"></span><input id="j.bg" class="key" inputmode="decimal"></label>
      <label id="j.egBox"><span data-t="egL"></span><input id="j.eg" placeholder="0.8 W"></label>
      <label><span data-t="hs"></span><input id="j.hs" inputmode="decimal"></label>
     </div>
     <details><summary data-t="more"></summary>
      <div class="f"><label><span>Bearing Standard</span><input id="j.bs" inputmode="decimal"></label><label><span>Steering</span><input id="j.hst" inputmode="decimal"></label><label><span>Heel</span><input id="j.heel"></label><label><span>Observer</span><input id="j.obs"></label><label class="wide"><span>Remarks</span><input id="j.rem"></label></div>
     </details>
     <details><summary data-t="devH"></summary>
      <label><span data-t="devName"></span><input id="devName"></label>
      <div class="devg" id="devGrid"></div>
      <p class="note" data-t="devNote"></p>
      <div class="acts"><button class="b s" id="devReset" data-t="devReset"></button></div>
     </details>
    </div>
   </div>
   <div class="lg-res">
    <div class="card">
     <div class="k" id="jK"></div>
     <div class="big" id="jRes">—</div>
     <table class="jt" id="jTab"></table>
     <p class="note" id="jNote"></p>
     <div class="acts"><button class="b p" id="jSave" data-t="save"></button><button class="b" id="jCopy" data-t="copyAll"></button></div>
     <p class="note" id="jMsg"></p>
     <ul class="logl" id="jLog"></ul>
     <details><summary data-t="how"></summary><p class="note" data-t="jHow"></p></details>
    </div>
   </div>
   <div class="lg-pl">
    <div class="card">
     <h2 data-t="wH"></h2>
     <div class="tm"><label><span data-t="date"></span><input id="w.date" type="date"></label><button class="b" id="w.today" data-t="today" style="grid-column:2/4"></button></div>
     <div class="f" style="margin-top:10px"><label class="wide"><span data-t="watches"></span><input id="w.ws" placeholder="00-06, 12-18"></label></div>
     <div id="wOut"></div>
    </div>
   </div>
  </div>
 </section>
 <!-- НЕБО -->
 <section id="p-sky" hidden>
  <div class="grid2">
   <div class="card">
    <div class="tm"><label><span data-t="date"></span><input id="s.date" type="date"></label><label><span data-t="time"></span><input id="s.time" placeholder="18:40:00"></label><button class="b" id="s.now" data-t="now"></button></div>
    <div class="mid" id="twi" style="margin-top:12px"></div>

   </div>

    <label class="chk"><input type="checkbox" id="s.only"><span data-t="onlyGood"></span></label>

 </section>

 <!-- ВЫСОТА -->
 <section id="p-alt" hidden>
  <div class="grid2">
   <div class="card">
    <h2 data-t="aH"></h2>
    <div class="f"><label class="wide"><span data-t="body"></span><select id="a.body"></select></label></div>
    <div class="tm" style="margin-top:10px"><label><span data-t="date"></span><input id="a.date" type="date"></label><label><span data-t="time"></span><input id="a.time" placeholder="18:44:30"></label><button class="b" id="a.now" data-t="now"></button></div>
    <div class="f" style="margin-top:10px"><label class="wide"><span data-t="hsL"></span><input id="a.hs" class="key" placeholder="55 52.7" inputmode="decimal"></label></div>
   </div>
   <div class="card">
    <div class="k" data-t="intK"></div>
    <div class="big" id="aRes">—</div>
    <div class="kv"><div><div class="k" data-t="azK"></div><div class="mid" id="aZ">—</div></div><div><div class="k">ho / hc</div><div class="mid" id="aH">—</div></div></div>
    <div class="fig"><svg id="aPic" role="img"></svg></div>

    <details><summary data-t="stepsH"></summary><table class="steps" id="aSteps"></table></details>

  </div>
 </section>

 <!-- ОБСЕРВАЦИЯ -->

  <div class="grid2">
   <div class="card">
    <h2 data-t="oH"></h2>
    <div class="f">
     <label><span data-t="date"></span><input id="o.date" type="date"></label>
     <label><span data-t="course"></span><input id="o.c" inputmode="decimal"></label>
     <label><span data-t="speed"></span><input id="o.v" inputmode="decimal"></label>
    </div>
    <div id="oRows"></div>
    <div class="acts"><button class="b" id="o.add" data-t="addSight"></button></div>
    <h3 data-t="gpsH"></h3>
    <div class="f"><label><span data-t="lat"></span><input id="o.glat"></label><label><span data-t="lon"></span><input id="o.glon"></label></div>
    <div class="acts"><button class="b s" id="gpsObs" data-t="gpsBtn"></button></div>
    <details><summary data-t="how"></summary><p class="note" data-t="oHow"></p></details>
   </div>
   <div class="card">
    <div class="k" id="oK"></div>
    <div class="big" id="oRes">—</div>
    <div class="fig" style="height:300px"><svg id="oPic" role="img"></svg></div>
    <div class="scroll"><table id="oTab"></table></div>
    <p class="note" id="oNote"></p>
    <div class="acts"><button class="b" id="o.toShip" data-t="toShip"></button></div>
   </div>
  </div>
 </section>
</div>
<script>
// ===== Навигационное ядро (без DOM) =====
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const n360 = x => ((x % 360) + 360) % 360;
const n180 = x => { x = n360(x); return x > 180 ? x - 360 : x; };
const sinD = x => Math.sin(x * D2R), cosD = x => Math.cos(x * D2R), tanD = x => Math.tan(x * D2R);

// --- разбор/формат координат и углов ---
function parseCoord(s, isLat) {
  if (s == null) return NaN;
  s = String(s).trim().toUpperCase().replace(/,/g, '.');
  if (!s) return NaN;
  let sign = /[SЮWЗ]/.test(s) || /^\s*-/.test(s) ? -1 : 1;
  const m = s.match(/\d+(\.\d+)?/g);
  if (!m) return NaN;
  let v = +m[0] + (m[1] ? +m[1] / 60 : 0) + (m[2] ? +m[2] / 3600 : 0);
  if (v > (isLat ? 90 : 180)) return NaN;
  return sign * v;
}
function parseAngle(s) { // "34 12.5", "34°12,5'", "34.208", "-1.5"
  if (s == null) return NaN;
  s = String(s).trim().replace(/,/g, '.');
  if (!s) return NaN;
  const sign = /^\s*-/.test(s) ? -1 : 1;
  const m = s.match(/\d+(\.\d+)?/g);
  if (!m) return NaN;
  return sign * (+m[0] + (m[1] ? +m[1] / 60 : 0) + (m[2] ? +m[2] / 3600 : 0));
}
function parseNum(s) { if (s == null) return NaN; s = String(s).trim().replace(',', '.'); return s === '' ? NaN : +s; }
function fmtDM(v, isLat) {
  if (!isFinite(v)) return '—';
  const h = isLat ? (v >= 0 ? 'N' : 'S') : (v >= 0 ? 'E' : 'W');
  const a = Math.abs(v); let d = Math.floor(a); let m = Math.round((a - d) * 600) / 10;
  if (m >= 60) { d++; m = 0; }
  return `${String(d).padStart(isLat ? 2 : 3, '0')}°${m.toFixed(1).padStart(4, '0')}′${h}`;
}
function fmtAng(v) { // градусы → 34°12.5′ (со знаком)
  if (!isFinite(v)) return '—';
  const s = v < 0 ? '−' : ''; const a = Math.abs(v); let d = Math.floor(a); let m = Math.round((a - d) * 600) / 10;
  if (m >= 60) { d++; m = 0; }
  return `${s}${d}°${m.toFixed(1).padStart(4, '0')}′`;
}
const fmtC = c => isFinite(c) ? String(Math.round(n360(c) * 10) / 10).replace('.', ',').padStart(3, '0') + '°' : '—';
// время "чч:мм[:сс]" с необязательным "+1 " (следующие сутки) → секунды от 00:00 даты
function parseTime(s) {
  if (s == null) return NaN; s = String(s).trim();
  let day = 0; const pm = s.match(/^\+\s*(\d+)\s+/); if (pm) { day = +pm[1]; s = s.slice(pm[0].length); }
  const m = s.match(/^(\d{1,2})[:\s.](\d{1,2})(?:[:\s.](\d{1,2}(?:[.,]\d+)?))?$/);
  if (!m) return NaN;
  const h = +m[1], mi = +m[2], se = m[3] ? +m[3].replace(',', '.') : 0;
  if (h > 23 || mi > 59 || se >= 60) return NaN;
  return day * 86400 + h * 3600 + mi * 60 + se;
}
function parseDur(s) { // "3:30" или "3.5" (часы) → часы
  if (s == null) return NaN; s = String(s).trim().replace(',', '.');
  const m = s.match(/^(\d+):(\d{1,2})$/); if (m) return +m[1] + +m[2] / 60;
  return s === '' ? NaN : +s;
}
function utcMs(dateStr, sec) { // "2026-11-21" + секунды → мс UTC
  const m = String(dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m || !isFinite(sec)) return NaN;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]) + sec * 1000;
}

// --- плавание по локсодромии (сфера) ---
const MP = lat => 10800 / Math.PI * Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2));
function sail(p, course, dist) {
  const dlat = dist * cosD(course) / 60;
  let lat2 = Math.max(-89.9, Math.min(89.9, p.lat + dlat));
  let dlon = Math.abs(dlat) < 1e-7 ? dist * sinD(course) / (60 * cosD(p.lat))
    : (MP(lat2) - MP(p.lat)) * tanD(course) / 60;
  return { lat: lat2, lon: n180(p.lon + dlon) };
}
function rhumb(a, b) { // курс и расстояние (мили) из a в b
  const dlat = (b.lat - a.lat) * 60, dlon = n180(b.lon - a.lon) * 60;
  if (Math.abs(dlat) < 1e-6) return { course: dlon >= 0 ? 90 : 270, dist: Math.abs(dlon) * cosD(a.lat) };
  const C = n360(Math.atan2(dlon, MP(b.lat) - MP(a.lat)) * R2D);
  return { course: C, dist: Math.abs(dlat / cosD(C)) };
}
// локальная плоскость (мили): x — на восток, y — на север
const toXY = (ref, p) => ({ x: n180(p.lon - ref.lon) * 60 * cosD(ref.lat), y: (p.lat - ref.lat) * 60 });

$('jSave').addEventListener('click', () => { if (!JROW) return; S.log.push(JROW.map(r => [r[0], r[1], r[2]])); S.j.bg = ''; S.j.hs = ''; $('j.bg').value = ''; $('j.hs').value = ''; save(); logList(); $('jMsg').textContent = T.saved; setAuto(true); });
$('jCopy').addEventListener('click', async () => {
  const rows = S.log.length ? S.log : JROW ? [JROW] : []; if (!rows.length) return;
  const txt = [rows[0].map(r => (r[0] ? r[0] + ' ' : '') + r[1]).join('\t'), ...rows.map(r => r.map(x => x[2]).join('\t'))].join('\n');
  try { await navigator.clipboard.writeText(txt); $('jMsg').textContent = T.copied; } catch (e) { $('jMsg').textContent = txt; }
});

// ---- планировщик вахты
function plan() {
  const p = pos(); if (!p) { $('wOut').innerHTML = `<p class="note warn">${T.sumNo}</p>`; return; }
  const date = S.w.date || today(); if (!$('w.date').value) $('w.date').value = date;
  const tz = tzOf(), base = utcMs(date, 0) - tz * 3600000, hm = m => `${String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0')}:${String(((m % 60) + 60) % 60).padStart(2, '0')}`;
  const ws = [...String(S.w.ws || '').matchAll(/(\d{1,2})\s*[-–:]\s*(\d{1,2})/g)];
  let H = '';
  for (const m of ws) {
    const st = +m[1] * 60, en = (+m[2] <= +m[1] ? +m[2] + 24 : +m[2]) * 60;
    const sunA = mm => { const e = sunEphem(base + mm * 60000); return altAz(p, e.gha, e.dec); };
    const wins = []; let cur = null;
    for (let mm = st; mm <= en; mm += 2) { const a = sunA(mm), ok = a.hc > -0.3 && a.hc < 20; if (ok && !cur) cur = { a: mm, z1: a.zn }; if (ok) { cur.b = mm; cur.z2 = a.zn; } if (!ok && cur) { wins.push(cur); cur = null; } }
    if (cur) wins.push(cur);
    let body = wins.map(w => `<li><b>${hm(w.a)}–${hm(w.b)}</b><span>${T.wSun}, ${T.az} ${C(w.z1)}→${C(w.z2)}</span><button class="b s" data-go="log" data-body="sunL" data-ms="${base + (w.a + (w.b - w.a) / 2) * 60000}">${T.take}</button></li>`).join('');
    const dark = []; for (let mm = st; mm <= en; mm += 10) if (sunA(mm).hc < -9) dark.push(mm);
    if (dark.length) {
      const mid = dark[Math.floor(dark.length / 2)], ms = base + mid * 60000;
      const c = STARS.map(s0 => { const e = starEphem(s0, ms); return { s: s0, a: altAz(p, e.gha, e.dec) }; }).filter(x => (x.a.hc >= 5 && x.a.hc <= 30) || (x.s.key === 'Polaris' && x.a.hc > 0 && x.a.hc < 45)).sort((x, y) => x.a.zn - y.a.zn);
      body += c.map(x => `<li><b>${hm(mid)} ${esc(starName(x.s))}</b><span>h ${A(x.a.hc)}, ${T.az} ${C(x.a.zn)}</span><button class="b s" data-go="log" data-body="${x.s.key}" data-ms="${ms}">${T.take}</button></li>`).join('');
    }
    H += `<div class="wh">${hm(st)}–${hm(en)}</div>` + (body ? `<ul class="wl">${body}</ul>` : `<p class="note">${T.wNone}</p>`);
  }
  $('wOut').innerHTML = H;
}
$('w.today').addEventListener('click', () => { S.w.date = today(); $('w.date').value = S.w.date; save(); plan(); });

// ---- переходы между вкладками с подстановкой светила и времени
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const d = new Date(+b.dataset.ms).toISOString(), go = b.dataset.go, grp = go === 'log' ? 'j' : 'a';
  S[grp].body = b.dataset.body; S[grp].date = d.slice(0, 10); S[grp].time = d.slice(11, 19); save(); fill(); opts();
  location.hash = go; show(go); refresh(grp); window.scrollTo(0, 0);
});

// ---- НЕБО
function presetHs(hc, eph, limb, g) { let h = hc; for (let k = 0; k < 15; k++) h += hc - correctAlt(Math.max(h, 0.5), g, eph, limb).ho; return h; }
let SKY = [];
function sky() {
  const p = pos(), ms = utcMs(S.s.date, parseTime(S.s.time)), g = G();
  if (!p || !isFinite(ms)) { $('skyTab').innerHTML = ''; $('dome').innerHTML = ''; $('twi').textContent = ''; $('sunTxt').textContent = !p ? T.sumNo : ''; SKY = []; return; }
  const se = sunEphem(ms), sa = altAz(p, se.gha, se.dec), h = sa.hc;
  $('twi').textContent = h > 0 ? T.day : h > -6 ? T.civil : h > -12 ? T.naut : h > -18 ? T.astro : T.night;
  $('sunTxt').textContent = T.sunAt(A(h), C(sa.zn));
  SKY = [{ id: 'sunL', name: T.sun, sun: true, eph: se, a: sa }, ...STARS.map(st => { const e = starEphem(st, ms); return { id: st.key, name: starName(st), eph: e, a: altAz(p, e.gha, e.dec) }; })];
  const good = x => x.a.hc >= 10 && x.a.hc <= 70, side = z => T.pts[Math.round(n360(z) / 22.5) % 16];
  const rows = SKY.filter(x => x.a.hc > 0 && (!S.s.only || good(x))).sort((a, b) => a.a.zn - b.a.zn);
  $('skyTab').innerHTML = rows.length ? rows.map(x => `<li class="${good(x) ? 'good' : 'low'}"><b>${esc(x.name)}</b><span>h ${A(x.a.hc)} · ${T.az} ${C(x.a.zn)} ${side(x.a.zn)}${x.a.hc > 3 ? ` · ${T.cSet} ${A(presetHs(x.a.hc, x.eph, x.sun ? 'L' : '', g))}` : ''}</span><span class="go"><button class="b s" data-go="log" data-body="${x.id}" data-ms="${ms}">${T.toLog}</button><button class="b s" data-go="alt" data-body="${x.id}" data-ms="${ms}">${T.toAlt}</button></span></li>`).join('')
    : `<li><span>${T.noStars}</span></li>`;
  dome();
}
function dome() {
  const svg = $('dome'), W = svg.clientWidth; if (!W || !SKY.length) return;
  const c = W / 2, R = W / 2 - 24, xy = (h, z) => { const r = R * (90 - h) / 90; return [c + r * Math.sin(z * Math.PI / 180), c - r * Math.cos(z * Math.PI / 180)]; };
  let g = `<circle cx="${c}" cy="${c}" r="${R}" fill="var(--sea)" stroke="var(--mute)" stroke-width="1.5"/>`;
  for (const h of [30, 60]) g += `<circle cx="${c}" cy="${c}" r="${R * (90 - h) / 90}" fill="none" stroke="var(--line)"/>`;
  g += `<path d="M${c - R} ${c}H${c + R}M${c} ${c - R}V${c + R}" stroke="var(--line)"/>`;
  T.dirs.forEach((d, i) => { const [x, y] = xy(-13, i * 90); g += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${d}</text>`; });
  const used = [];
  for (const x of SKY.filter(x => x.a.hc > 0)) {
    const [px, py] = xy(x.a.hc, x.a.zn), good = x.a.hc >= 10 && x.a.hc <= 70;
    g += x.sun ? `<circle cx="${px}" cy="${py}" r="8" fill="#f2b200" stroke="#9a6b00"/>` : `<circle cx="${px}" cy="${py}" r="${good ? 4 : 3}" fill="${good ? 'var(--acc)' : 'var(--mute)'}"/>`;
    let ty = py - 8; const tx = px + (px > c ? -8 : 8);
    while (used.some(u => Math.abs(u[0] - tx) < 60 && Math.abs(u[1] - ty) < 13)) ty += 13;
    used.push([tx, ty]);
    g += `<text x="${tx}" y="${ty}" text-anchor="${px > c ? 'end' : 'start'}" font-size="12" fill="${good || x.sun ? 'var(--ink)' : 'var(--mute)'}" font-weight="${good ? 600 : 400}">${esc(x.name)}</text>`;
  }
  svg.innerHTML = g;
}

// ---- ВЫСОТА
const row = (n, v, cls) => `<tr${cls ? ' class="t"' : ''}><td>${n}</td><td>${v}</td></tr>`;
function alt() {
  const p = pos(), g = G(), ms = utcMs(S.a.date, parseTime(S.a.time)), hs = parseAngle(S.a.hs);
  if (!p || !isFinite(ms) || !isFinite(hs)) { ['aRes', 'aZ', 'aH'].forEach(i => $(i).textContent = '—'); $('aSteps').innerHTML = ''; $('aPic').innerHTML = ''; $('aNote').textContent = !p ? T.sumNo : ''; return; }
  const id = S.a.body, limb = id === 'sunL' ? 'L' : id === 'sunU' ? 'U' : '', eph = bodyEphem(id, ms), c = correctAlt(hs, g, eph, limb), az = altAz(p, eph.gha, eph.dec), n = (c.ho - az.hc) * 60;
  $('aRes').textContent = `${D(Math.abs(n).toFixed(1))} ${T.nm} ${n >= 0 ? T.tw : T.aw}`; $('aZ').textContent = C(az.zn); $('aH').textContent = `${A(c.ho)} / ${A(az.hc)}`;
  let H = row(T.rHs, A(hs)) + row(T.rIc, mn(g.i / 60)) + row(T.rDip, mn(-c.dip)) + row(T.rHa, A(c.ha), 1) + row(T.rRef, mn(-c.R));
  if (limb) H += row(T.rPar, mn(c.par)) + row(T.rSd, mn(c.sd));
  H += row(T.rHo, A(c.ho), 1);
  H += limb ? row(T.rGha, A(eph.gha)) : row(T.rGhaAr, A(gast(ms))) + row(T.rSha, A(eph.sha)) + row(T.rGha, A(eph.gha));
  H += row(T.rDec, DM(eph.dec, true)) + row(T.rLha, A(az.lha)) + row(T.rHc, A(az.hc), 1) + row(T.rZn, C(az.zn)) + row(T.rInt, `${D(Math.abs(n).toFixed(1))}′ ${n >= 0 ? T.tw : T.aw}`, 1);
  $('aSteps').innerHTML = H;
  const w = []; if (hs < 10) w.push(T.w10); if (Math.abs(n) > 30) w.push(T.w30);
  $('aNote').className = w.length ? 'note warn' : 'note'; $('aNote').textContent = w.length ? w.join(' ') : T.aOk;
  const svg = $('aPic'), W = svg.clientWidth, Hh = svg.clientHeight; if (!W) return;
  const cx = W / 2, cy = Hh / 2, sc = Math.min(W, Hh) * 0.32 / Math.max(Math.abs(n), 1), ux = Math.sin(az.zn * Math.PI / 180), uy = -Math.cos(az.zn * Math.PI / 180);
  const px = cx + ux * n * sc, py = cy + uy * n * sc, Lg = 2000, ax = cx + ux * Math.min(W, Hh) * 0.44, ay = cy + uy * Math.min(W, Hh) * 0.44;
  svg.innerHTML = `<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="var(--mute)" stroke-dasharray="4 4"/><text x="${ax + (ux > 0 ? -6 : 6)}" y="${ay + (uy > 0 ? -6 : 14)}" font-size="13" fill="var(--mute)" text-anchor="${ux > 0 ? 'end' : 'start'}">${C(az.zn)}</text>
   <line x1="${px - uy * Lg}" y1="${py + ux * Lg}" x2="${px + uy * Lg}" y2="${py - ux * Lg}" stroke="var(--acc)" stroke-width="2.5"/><line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="var(--acc)" stroke-width="1.5"/>
   <path d="M${cx - 7} ${cy}h14M${cx} ${cy - 7}v14" stroke="var(--ink)" stroke-width="2"/><text x="${cx + 9}" y="${cy + 18}" font-size="13" font-weight="600" fill="var(--ink)">${T.dr}</text>
   <path d="M${W - 18} 32V12l-5 8m5-8l5 8" stroke="var(--mute)" stroke-width="2" fill="none"/><text x="${W - 22}" y="46" font-size="12" fill="var(--mute)">N</text>`;
}

// ---- ОБСЕРВАЦИЯ
function oRows() {
  const so = `<option value="sunL">${T.sunL}</option><option value="sunU">${T.sunU}</option>` + [...STARS].map(s => [s.key, starName(s)]).sort((a, b) => a[1].localeCompare(b[1], S.lang)).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('');
  $('oRows').innerHTML = S.o.rows.map((r, i) => `<div class="row3"><label>${T.body}<select data-o="${i}" data-f="b">${so}</select></label><label>${T.time}<input data-o="${i}" data-f="t" value="${esc(r.t)}" placeholder="18:41:12"></label><label>${T.hsL}<input class="key" data-o="${i}" data-f="h" value="${esc(r.h)}" inputmode="decimal"></label><button class="x" data-odel="${i}" aria-label="×">×</button></div>`).join('');
  $('oRows').querySelectorAll('select').forEach(s => s.value = S.o.rows[+s.dataset.o].b);
}
$('oRows').addEventListener('input', e => { const t = e.target; if (t.dataset.o == null) return; S.o.rows[+t.dataset.o][t.dataset.f] = t.value; save(); fix(); });
$('oRows').addEventListener('change', e => { const t = e.target; if (t.tagName !== 'SELECT') return; S.o.rows[+t.dataset.o].b = t.value; save(); fix(); });
$('oRows').addEventListener('click', e => { const b = e.target.closest('[data-odel]'); if (!b) return; S.o.rows.splice(+b.dataset.odel, 1); save(); oRows(); fix(); });
$('o.add').addEventListener('click', () => { S.o.rows.push({ b: 'Sirius', t: '', h: '' }); save(); oRows(); fix(); });
let FIX = null;
function fix() {
  const p = pos(), g = G(), course = parseNum(S.o.c) || 0, v = parseNum(S.o.v) || 0;
  const sights = S.o.rows.map(r => ({ id: r.b, ms: utcMs(S.o.date, parseTime(r.t)), hs: parseAngle(r.h) })).filter(s => isFinite(s.ms) && s.hs > 0 && s.hs < 90);
  FIX = null; $('oNote').className = 'note';
  if (!p || !sights.length) { $('oRes').textContent = '—'; $('oK').textContent = ''; $('oTab').innerHTML = ''; $('oPic').innerHTML = ''; $('oNote').textContent = !p ? T.sumNo : T.oNeed; return; }
  const fms = Math.max(...sights.map(s => s.ms));
  const r = astroFix(sights, { pos: p, ms: fms, course, speed: v }, g, fms);
  FIX = r.fix;
  const hh = new Date(fms).toISOString().slice(11, 16);
  $('oK').textContent = r.single ? T.oK1 : T.oK(hh); $('oRes').textContent = `${DM(r.fix.lat, true)} ${DM(r.fix.lon, false)}`;
  $('oTab').innerHTML = `<tr><th>${T.cBody}</th><th>ho</th><th>${T.rInt}</th><th>${T.cAz}</th></tr>` + r.lops.map(l => `<tr><td>${esc(bodyName(l.s.id))}</td><td>${A(l.c.ho)}</td><td>${(l.p >= 0 ? '+' : '−') + D(Math.abs(l.p).toFixed(1))}′</td><td>${C(l.az.zn)}</td></tr>`).join('');
  const nv = rhumb(r.drFix, r.fix), notes = [nv.dist < 0.05 ? T.nev('—', D('0.0')) : T.nev(C(nv.course), D(nv.dist.toFixed(1)))];
  if (r.rms != null) notes.push(T.rms(D(r.rms.toFixed(1))));
  let bad = r.rms > 2;
  const gp = { lat: parseCoord(S.o.glat, true), lon: parseCoord(S.o.glon, false) };
  if (isFinite(gp.lat) && isFinite(gp.lon)) { const d = rhumb(gp, r.fix); notes.push(T.gps(D(d.dist.toFixed(1)), C(d.course))); notes.push(d.dist > 2 ? T.gpsBad : T.gpsOk); if (d.dist > 2) bad = true; }
  $('oNote').className = bad ? 'note warn' : 'note'; $('oNote').textContent = notes.join(' ');
  // схема
  const svg = $('oPic'), W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const pts = [r.fix, r.drFix, ...(isFinite(gp.lat) ? [gp] : [])].map(q => toXY(r.fix, q));
  const span = Math.max(3, ...pts.map(q => Math.max(Math.abs(q.x), Math.abs(q.y))) ) * 2.4, k = Math.min(W, H) / span;
  const X = q => W / 2 + q.x * k, Y = q => H / 2 - q.y * k;
  let s = '';
  for (const l of r.lops) { const q = toXY(r.fix, sail(l.apT, l.az.zn, l.p)), ux = Math.sin(l.az.zn * Math.PI / 180), uy = Math.cos(l.az.zn * Math.PI / 180), Lg = 500;
    s += `<line x1="${X({ x: q.x - uy * Lg })}" y1="${Y({ y: q.y + ux * Lg })}" x2="${X({ x: q.x + uy * Lg })}" y2="${Y({ y: q.y - ux * Lg })}" stroke="var(--acc)" stroke-width="2"/>`; }
  const mark = (q, t, col, sh) => { const x = X(q), y = Y(q); return (sh === 'o' ? `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${col}" stroke-width="2.5"/>` : sh === 's' ? `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" fill="none" stroke="${col}" stroke-width="2.5"/>` : `<path d="M${x - 7} ${y}h14M${x} ${y - 7}v14" stroke="${col}" stroke-width="2"/>`) + (sh === '+' ? `<text x="${x - 10}" y="${y + 20}" text-anchor="end" font-size="13" font-weight="600" fill="${col}">${t}</text>` : `<text x="${x + 10}" y="${y - 9}" font-size="13" font-weight="600" fill="${col}">${t}</text>`); };
  s += mark(pts[1], T.dr, 'var(--ink)', '+'); if (pts[2]) s += mark(pts[2], T.gpsP, 'var(--ok)', 's'); s += mark(pts[0], T.fix, 'var(--acc)', 'o');
  const st = [0.5, 1, 2, 5, 10, 20, 50].find(x => x * k > 50) || 100;
  s += `<path d="M12 ${H - 14}h${st * k}" stroke="var(--mute)" stroke-width="2"/><text x="12" y="${H - 20}" font-size="12" fill="var(--mute)">${D(st)} ${T.nm}</text><path d="M${W - 18} 32V12l-5 8m5-8l5 8" stroke="var(--mute)" stroke-width="2" fill="none"/><text x="${W - 22}" y="46" font-size="12" fill="var(--mute)">N</text>`;
  svg.innerHTML = s;
}
function phoneGps(done) {
  const m = $('gpsMsg'); m.hidden = false; m.className = 'note';
  if (!('geolocation' in navigator)) { m.className = 'note warn'; m.textContent = T.gpsNo; return; }
  m.textContent = T.gpsWait;
  try {
    navigator.geolocation.getCurrentPosition(p => { const c = p.coords; done(c.latitude, c.longitude); m.className = 'note okc'; m.textContent = T.gpsOk(Math.round(c.accuracy), new Date(p.timestamp).toISOString().slice(11, 19)); },
      e => { m.className = 'note warn'; m.textContent = e.code === 1 ? (window.isSecureContext === false ? T.gpsNo : T.gpsDen) : e.code === 3 ? T.gpsTime : T.gpsNone; },
      { enableHighAccuracy: true, timeout: 40000, maximumAge: 60000 });
  } catch (e) { m.className = 'note warn'; m.textContent = T.gpsNo; }
}
$('gpsBtn').addEventListener('click', () => phoneGps((la, lo) => { S.g.lat = DM(la, true); S.g.lon = DM(lo, false); save(); fill(); refresh('g'); }));
$('gpsObs').addEventListener('click', () => { phoneGps((la, lo) => { S.o.glat = DM(la, true); S.o.glon = DM(lo, false); save(); fill(); fix(); }); window.scrollTo(0, 0); });
$('o.toShip').addEventListener('click', () => { if (!FIX) return; S.g.lat = DM(FIX.lat, true); S.g.lon = DM(FIX.lon, false); save(); fill(); refresh('g'); });

// ---- язык и вкладки
function applyLang() {
  T = L[S.lang] || L.ru; document.documentElement.lang = S.lang; document.title = T.app;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T[el.dataset.t]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
  $('dome').setAttribute('aria-label', T.tSky); $('aPic').setAttribute('aria-label', T.rInt); $('oPic').setAttribute('aria-label', T.oH);
  opts(); oRows(); shipSum(); jlog(); logList(); plan(); sky(); alt(); fix(); if (typeof clock === 'function' && $('jClock')) try { clock(); } catch (e) { }
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; save(); applyLang(); }));
const TABS = ['log', 'sky', 'alt', 'fix'];
function show(t) {
  if (!TABS.includes(t)) t = S.tab || 'log';
  S.tab = t; save();
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  TABS.forEach(x => $('p-' + x).hidden = x !== t);
  requestAnimationFrame(() => { if (t === 'sky') dome(); if (t === 'alt') alt(); if (t === 'fix') fix(); });
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; show(b.dataset.tab); window.scrollTo(0, 0); }));
addEventListener('hashchange', () => show(location.hash.slice(1)));
const ro = new ResizeObserver(() => { dome(); alt(); fix(); }); [$('dome').parentElement, $('aPic').parentElement, $('oPic').parentElement].forEach(el => ro.observe(el));
fill(); devGrid(); applyLang(); show(location.hash.slice(1)); clock();
if (!pos()) $('shipBox').hidden = false;
}
</script>
